name: Shared contracts and Part B correctness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download and test the pinned CPU model
        type: boolean
        default: false

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.3
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src contracts scripts_b scripts_shared tests/b tests/shared
      - run: uv run --no-sync ruff format --check src contracts scripts_b scripts_shared tests/b tests/shared
      - run: uv run --no-sync pytest tests/shared tests/b -m 'not model' -q
      - if: github.event_name == 'workflow_dispatch' && inputs.real_model
        run: uv run --no-sync pytest tests/b/test_model.py -m model -q

