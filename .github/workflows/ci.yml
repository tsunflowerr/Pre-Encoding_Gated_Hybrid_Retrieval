name: Shared contracts and Parts A/B/C correctness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download and test the pinned CPU model
        type: boolean
        default: false

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.3
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv pip check
      - run: uv run --no-sync ruff check src contracts scripts_a scripts_b scripts_c scripts_shared tests
      - run: uv run --no-sync ruff format --check src contracts scripts_a scripts_b scripts_c scripts_shared tests
      - run: uv run --no-sync pytest -m 'not model' -q
      - run: uv run --no-sync python -m compileall -q contracts src scripts_a scripts_b scripts_c scripts_shared
      - if: github.event_name == 'workflow_dispatch' && inputs.real_model
        run: uv run --no-sync pytest tests/b/test_model.py -m model -q

