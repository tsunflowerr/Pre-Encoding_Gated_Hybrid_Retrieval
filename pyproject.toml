[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pegh-research"
version = "0.1.0"
description = "CPU dense retrieval and reproducible profiling for PE-GH"
readme = "docs/person_b/README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "faiss-cpu>=1.12,<2",
  "torch>=2.6,<3",
  "sentence-transformers>=5.1,<6",
  "transformers>=4.56,<5",
  "psutil>=7,<8",
  "PyYAML>=6,<7",
  "pyarrow>=19,<24",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools]
packages = ["contracts", "pegh", "pegh.dense", "pegh.profiling"]
package-dir = {"" = "src", "contracts" = "contracts"}

[tool.pytest.ini_options]
testpaths = ["tests/b"]
markers = ["model: needs the pinned real model and network/local model cache"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

