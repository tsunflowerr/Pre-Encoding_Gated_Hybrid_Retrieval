[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pegh-research"
version = "0.1.0"
description = "Reproducible sparse/dense retrieval and evaluation for PE-GH"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "faiss-cpu>=1.12,<2",
  "torch>=2.6,<3",
  "sentence-transformers>=5.1,<6",
  "transformers>=4.56,<5",
  "psutil>=7,<8",
  "scikit-learn>=1.9,<2",
  "PyYAML>=6,<7",
  "pyarrow>=19,<24",
  "matplotlib>=3.9,<4",
  "bm25s>=0.2,<1",
  "ir-measures>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4.23,<5"]

[tool.setuptools]
include-package-data = false
packages = [
  "contracts",
  "pegh",
  "pegh.data",
  "pegh.fusion",
  "pegh.gating",
  "pegh.app",
  "pegh.sparse",
  "pegh.evaluation",
  "pegh.dense",
  "pegh.profiling",
]
package-dir = {"" = "src", "contracts" = "contracts"}

[tool.setuptools.package-data]
contracts = ["schemas/*.json", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/shared", "tests/a", "tests/b", "tests/c"]
markers = ["model: needs the pinned real model and network/local model cache"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

