# Second confirmation for the v3 round: the stronger encoder. Fixed BEFORE any bge-small
# vector, proxy, tier, feature or ranking of the fresh domains is computed. Hypotheses come
# from the exploratory bge-small run on programmers/unix (evaluation_dev_bge_small.json).
# The fresh domains' relevance labels were already scored once with MiniLM
# (evaluation_fresh_minilm.json), so this tests configurations chosen without those domains,
# not labels nobody has seen; nothing below was changed after reading the MiniLM results
# except the decision to run this second test at all.
schema_version: v3_preregistration_1
registered_on: "2026-10-29"
fresh_domains: [android, gis, mathematica, webmasters]
dataset: {id: BeIR/cqadupstack, revision: e84b7220ce5a4e6c49aeb568983b0ec5a7584c2c}
qrels: {id: BeIR/cqadupstack-qrels, revision: 13595a9f221256a9a21e91c8b0fed3563382b6a7}
encoder: {model: BAAI/bge-small-en-v1.5, revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a}
splits: the existing fresh five-fold split (seed 42), unchanged
selection:
  policy: identical to preregistration_fresh.yaml (validation-only, v1 tie rules)
  thresholds: v1 C6 rule, pooled validation rows, 0.005 macro / 0.01 per-domain vs S*
primary_gates: {v1: v1_ridge, cascade: v1_ridge}
analysis:
  metric: nDCG@10, equal-weight macro over the four domains
  bootstrap: 10000 group resamples within domain, seed 20261019
  multiplicity: Holm over B1-B4 at family-wise alpha 0.05 (one-sided bootstrap p-values)
hypothesis_tests:
  B1_h_star_superior_to_r_star: >-
    with an encoder stronger than BM25, FAISS candidates outside the BM25 top-100 matter
    (dev: H* - R* = +0.029)
  B2_p_star_superior_to_bm25: static bge proxy re-ranking improves BM25 (dev +0.011)
  B3_pe_gh_v1_noninferior_to_s_star: PE-GH v1 (bge) non-inferior to S*, margin 0.01
  B4_pe_gh_v1_beats_random_matched: v1_ridge beats 30-seed random routing at its own per-fold dense counts (dev +0.014)
secondary_reported_without_claims:
  - dense ratio of PE-GH v1 at its operating point (dev 87%)
  - BM25-margin and LiteGator-style SVM at matched budget; AUC/Spearman of gate scores
  - cascade mode is reported descriptively only; on dev it falls back to R* in every fold
negative_results_policy: >-
  every hypothesis is reported whatever the outcome; no threshold, alpha grid, feature or
  model change after the fresh bge-small rankings are scored
